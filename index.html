<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC // Modern Architecture Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Grid Wrapper -->
    <div class="site-container">
        
        <!-- Header / Navigation -->
        <header class="main-header">
            <div class="logo">KINETIC</div>
            <nav class="nav-links">
                <a href="#work">Work</a>
                <a href="#about">Studio</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1>Designing Spaces for the Next Generation.</h1>
                <p>A minimalist architectural collective focused on sustainability, concrete forms, and open layouts.</p>
            </div>
        </section>

        <!-- Project Grid -->
        <main id="work" class="portfolio-section">
            <h2 class="section-title">Selected Works</h2>
            <div class="portfolio-grid">
                
                <!-- Image 1: Brutalist Villa (Default: Bottom-Left) -->
                <div class="grid-item tall" style="background-image: url('https://images.unsplash.com/photo-1780324269570-2058961e78cc?w=600&auto=format&fit=crop&q=60');">
                    <div class="item-overlay"><span>Brutalist Villa</span></div>
                </div>
                
                <!-- Image 2: The Pavilion (Custom Position: Top-Right) -->
                <div class="grid-item wide" style="background-image: url('https://media.istockphoto.com/id/2230286265/photo/modern-indoor-outdoor-living-entertainment-space-and-patio-under-a-pavilion-pergola-poolside.webp?a=1&b=1&s=612x612&w=0&k=20&c=TwrMsYxObWcA8JQt3hIQlp8A_HTihy5JDDCBnELnAVY=');">
                    <div class="item-overlay pos-top-right"><span>The Pavilion</span></div>
                </div>
                
                <!-- Image 3: Monolith Office (Custom Position: Center) -->
                <div class="grid-item" style="background-image: url('https://plus.unsplash.com/premium_photo-1661914082480-4e9c89baa3be?w=600&auto=format&fit=crop&q=60');">
                    <div class="item-overlay pos-center"><span>Monolith Office</span></div>
                </div>
                
                <!-- Image 4: Glasshouse Forest (Default: Bottom-Left) -->
                <div class="grid-item" style="background-image: url('https://media.gettyimages.com/id/2047224552/photo/footbridge-jewel-changi-singapore-airport-modern-architecture.jpg?s=612x612&w=0&k=20&c=T5XIbxMsChwE_1LB6hDoCtXM39yjbXYoLe2qMjIKi5U=');">
                    <div class="item-overlay"><span>Glasshouse Forest</span></div>
                </div>
                
            </div>
        </main>

        <!-- Footer -->
        <footer id="contact" class="main-footer">
            <p>&copy; 2026 KINETIC Studio. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
